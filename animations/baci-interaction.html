<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BACI 变化之差 · Difference in Differences</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0d1117;font-family:"Microsoft YaHei","PingFang SC",sans-serif}.stage{position:relative;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.5)}canvas{display:block}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.watermark{position:absolute;right:32px;bottom:24px;color:rgba(255,255,255,.18);font:11px Consolas,monospace;letter-spacing:.12em}.controls{position:fixed;inset:auto 0 0;padding:14px 24px;display:flex;align-items:center;gap:16px;background:rgba(13,17,23,.94);border-top:1px solid rgba(255,255,255,.08);color:#d0d8e0;font-size:13px}.controls button{padding:7px 16px;border:1px solid rgba(255,255,255,.15);border-radius:5px;background:rgba(255,255,255,.08);color:inherit;cursor:pointer}.time{min-width:90px;color:#8899aa;font-family:Consolas,monospace}.scrubber{position:relative;flex:1;height:5px;background:rgba(255,255,255,.12);border-radius:3px;cursor:pointer}.fill{height:100%;background:#e07b5a;border-radius:3px}</style></head>
<body><div class="stage" id="stage"><canvas id="mainCanvas" aria-label="BACI 动画。修复地从 12 增至 16，对照地从 12 增至 13，变化之差为 3。"></canvas><p class="sr-only">动画分离共同时间趋势和修复地的额外变化。BACI 效果等于修复地变化 4 减去对照地变化 1，结果为 3。</p><div class="watermark">Created by Huashu-Design</div></div><div class="controls"><button id="btnPlay">⏸ 暂停</button><button id="btnReplay">⏮ 重播</button><div class="time" id="timeDisplay">0.0s / 10s</div><div class="scrubber" id="scrubber"><div class="fill" id="scrubFill"></div></div></div>
<script>(function(){
const canvas=document.getElementById('mainCanvas'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),btnPlay=document.getElementById('btnPlay'),btnReplay=document.getElementById('btnReplay'),timeDisplay=document.getElementById('timeDisplay'),scrubber=document.getElementById('scrubber'),scrubFill=document.getElementById('scrubFill');const STAGE_W=1920,STAGE_H=1080,DURATION=10,CONTROL={before:12,after:13},RESTORED={before:12,after:16},BACI=(RESTORED.after-RESTORED.before)-(CONTROL.after-CONTROL.before);let time=0,playing=true,last=null;const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3),fade=(t,a,b)=>ease((t-a)/(b-a));
function resize(){const s=Math.min(innerWidth/STAGE_W,(innerHeight-56)/STAGE_H);canvas.width=STAGE_W;canvas.height=STAGE_H;canvas.style.width=Math.round(STAGE_W*s)+'px';canvas.style.height=Math.round(STAGE_H*s)+'px';stage.style.width=canvas.style.width;stage.style.height=canvas.style.height}addEventListener('resize',resize);resize();function text(s,x,y,size,color='#e0e4e8',align='center',weight=500){ctx.fillStyle=color;ctx.font=`${weight} ${size}px "Microsoft YaHei","PingFang SC",sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function y(v){return 790-(v-9)*90}function point(x,v,color,label,p){ctx.globalAlpha=p;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y(v),13,0,Math.PI*2);ctx.fill();text(label,x,y(v)-34,22,color,'center',700);ctx.globalAlpha=1}function line(x1,v1,x2,v2,color,p){ctx.save();ctx.globalAlpha=p;ctx.strokeStyle=color;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y(v1));ctx.lineTo(x1+(x2-x1)*p,y(v1)+(y(v2)-y(v1))*p);ctx.stroke();ctx.restore()}
function draw(t){ctx.fillStyle='#1a1d20';ctx.fillRect(0,0,STAGE_W,STAGE_H);if(t<1.1){const p=fade(t,0,.6)*(1-clamp((t-.85)/.25));ctx.globalAlpha=p;text('BACI：变化之差',960,450,70,'#e7eaed','center',800);text('Before · After · Control · Impact',960,535,25,'#8899aa');ctx.globalAlpha=1;return}text('共同时间趋势与措施的额外变化必须分开',960,105,27,'#c7d2d8','center',600);const x1=520,x2=1400;ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(330,810);ctx.lineTo(1570,810);ctx.stroke();text('修复前',x1,855,22,'#8899aa');text('修复后',x2,855,22,'#8899aa');for(let v=10;v<=16;v+=2)text(String(v),300,y(v),17,'#6f7b84','right');const base=fade(t,1,2.3);point(x1,12,'#4d8294','对照 12',base);point(x1,12,'#e07b5a','修复 12',base);const lp=fade(t,2.8,4.8);line(x1,12,x2,13,'#4d8294',lp);line(x1,12,x2,16,'#e07b5a',lp);if(lp>.6){point(x2,13,'#4d8294','对照 13',fade(t,4,4.8));point(x2,16,'#e07b5a','修复 16',fade(t,4,4.8))}if(t>=5){const p=fade(t,5,6.1);ctx.globalAlpha=p;ctx.strokeStyle='#8ab1c0';ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.beginPath();ctx.moveTo(x1,y(12));ctx.lineTo(x2,y(13));ctx.stroke();ctx.setLineDash([]);text('共同时间趋势 +1',960,720,25,'#9fbfca','center',700);ctx.globalAlpha=1}if(t>=6.6){const p=fade(t,6.6,7.6);ctx.globalAlpha=p;ctx.fillStyle='rgba(224,123,90,.12)';ctx.beginPath();ctx.roundRect(430,875,1060,86,12);ctx.fill();text(`(16 − 12) − (13 − 12) = ${BACI}`,960,918,36,'#e9c2b1','center',800);text('变化之差',1360,918,20,'#e07b5a','left',700);ctx.globalAlpha=1}if(t>=8.2){const p=fade(t,8.2,9);ctx.globalAlpha=p;ctx.fillStyle='rgba(49,94,70,.94)';ctx.beginPath();ctx.roundRect(360,875,1200,112,14);ctx.fill();text('单看修复地前后变化，会把共同时间趋势算进措施效果',960,918,28,'#edf4ef','center',800);text('BACI 用对照地的同期变化近似这个反事实',960,960,21,'#b9d4c2');ctx.globalAlpha=1}}
function update(){timeDisplay.textContent=`${time.toFixed(1)}s / 10s`;scrubFill.style.width=time/DURATION*100+'%'}function tick(now){if(last===null){last=now;window.__ready=true}const dt=(now-last)/1000;last=now;if(playing){time+=dt;if(time>=DURATION)time=window.__recording?DURATION-.001:0}draw(time);update();requestAnimationFrame(tick)}btnPlay.onclick=()=>{playing=!playing;btnPlay.textContent=playing?'⏸ 暂停':'▶ 播放';last=null};btnReplay.onclick=()=>{time=0;playing=true;last=null;btnPlay.textContent='⏸ 暂停'};scrubber.onclick=e=>{const r=scrubber.getBoundingClientRect();time=clamp((e.clientX-r.left)/r.width)*DURATION;playing=false;btnPlay.textContent='▶ 播放';draw(time);update()};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();btnPlay.click()}else if(e.code==='KeyR')btnReplay.click();else if(e.code==='ArrowRight'){time=Math.min(DURATION,time+.5);playing=false}else if(e.code==='ArrowLeft'){time=Math.max(0,time-.5);playing=false}});draw(0);update();requestAnimationFrame(tick);
})();</script></body></html>
