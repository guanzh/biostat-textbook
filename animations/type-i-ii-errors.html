<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>两类错误 · Type I &amp; Type II Errors</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d1117;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
  .stage-wrap{position:relative;box-shadow:0 0 80px rgba(0,0,0,0.5);border-radius:4px;overflow:hidden}
  canvas{display:block}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .controls{position:fixed;bottom:0;left:0;right:0;background:rgba(13,17,23,0.92);backdrop-filter:blur(12px);padding:14px 24px;display:flex;align-items:center;gap:16px;color:#e0e4e8;font-size:13px;z-index:100;border-top:1px solid rgba(255,255,255,0.06)}
  .controls button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#d0d8e0;padding:7px 16px;border-radius:5px;cursor:pointer;font-size:13px;font-family:inherit;transition:background 0.15s}
  .controls button:hover{background:rgba(255,255,255,0.15)}
  .time-display{font-family:"SF Mono","Consolas",monospace;font-variant-numeric:tabular-nums;min-width:90px;color:#8899aa}
  .scrubber{flex:1;height:5px;background:rgba(255,255,255,0.12);border-radius:3px;position:relative;cursor:pointer}
  .scrubber-fill{position:absolute;top:0;left:0;height:100%;background:#e07b5a;border-radius:3px}
  .title-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:10}
  .title-overlay h1{font-size:58px;font-weight:900;color:#e0e4e8;letter-spacing:0.12em;margin:0;line-height:1.2;white-space:nowrap}
  .title-overlay p{font-size:18px;font-weight:300;color:#8899aa;font-family:"Georgia","Times New Roman",serif;font-style:italic;margin-top:8px;letter-spacing:0.06em;white-space:nowrap}
  .watermark{position:absolute;bottom:24px;right:32px;font-size:11px;color:rgba(255,255,255,0.14);font-family:"SF Mono","Consolas",monospace;letter-spacing:0.12em;pointer-events:none;z-index:10}
</style>
</head>
<body>

<div class="stage-wrap" id="stageWrap">
  <canvas id="mainCanvas" aria-label="两类错误动画。H₀ 分布右侧红色尾部为第一类错误 α，H₁ 分布左侧蓝色区域为第二类错误 β，绿色区域为检验功效 1−β。增加样本量使分布分离，β 大幅缩小。"></canvas>
  <p class="sr-only">统计假设检验的两类错误。第一类错误 α：H₀ 为真时拒绝 H₀。第二类错误 β：H₁ 为真时未能拒绝 H₀。检验功效为 1−β。样本量增大后，H₁ 在标准化尺度上向右移动，β 从约 0.20 降至约 0.002，功效接近 1。</p>
  <div class="title-overlay" id="titleOverlay">
    <h1>两类错误</h1>
    <p>Type I &alpha;  &middot;  Type II &beta;  &middot;  Power 1&minus;&beta;</p>
  </div>
  <div class="watermark" id="watermark">Created by Huashu-Design</div>
</div>

<div class="controls">
  <button id="btnPlay">⏸ 暂停</button>
  <button id="btnReplay">⏮ 重播</button>
  <div class="time-display" id="timeDisplay">0.0s / 10.0s</div>
  <div class="scrubber" id="scrubber"><div class="scrubber-fill" id="scrubFill"></div></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// Type I & Type II Errors  ·  10-second animation
// H₀: N(0,1)  ·  α=0.05 one-tailed
// H₁ shifts from N(2.5,1) to N(4.5,1) to show the effect
// of increasing sample size / effect size on β and power.
// β: initial ≈0.196, final ≈0.002
// ═══════════════════════════════════════════════════════════
(function(){
  const canvas=document.getElementById('mainCanvas');
  const ctx=canvas.getContext('2d');
  const stageWrap=document.getElementById('stageWrap');
  const titleOverlay=document.getElementById('titleOverlay');
  const watermark=document.getElementById('watermark');
  const btnPlay=document.getElementById('btnPlay');
  const btnReplay=document.getElementById('btnReplay');
  const timeDisplay=document.getElementById('timeDisplay');
  const scrubFill=document.getElementById('scrubFill');
  const scrubber=document.getElementById('scrubber');

  const STAGE_W=1920, STAGE_H=1080;
  const DURATION=10;
  const SQRT_2PI=Math.sqrt(2*Math.PI);

  // Fixed values
  const MU0=0;
  const MU1_INITIAL=2.5;
  const MU1_FINAL=4.5;
  const Z_CRIT=1.645;           // α=0.05 one-tailed
  const ALPHA=0.05;

  let time=0, playing=true, lastTick=null;

  // ── Math helpers ──
  function normalPDF(x,mu,sigma){
    const z=(x-mu)/sigma;
    return Math.exp(-0.5*z*z)/(sigma*SQRT_2PI);
  }

  function normalCDF(x){
    // Abramowitz & Stegun approximation
    const a1=0.254829592, a2=-0.284496736, a3=1.421413741;
    const a4=-1.453152027, a5=1.061405429;
    const p=0.3275911;
    const sign=x<0?-1:1;
    const absX=Math.abs(x)/Math.sqrt(2);
    const t=1.0/(1.0+p*absX);
    const y=1.0-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-absX*absX);
    return 0.5*(1.0+sign*y);
  }

  function expoOut(t){return t<=0?0:t>=1?1:1-Math.pow(2,-10*t)}
  function clamp01(x){return Math.max(0,Math.min(1,x))}
  function lerp(a,b,t){return a+(b-a)*t}
  function ease(t,start,end){
    return expoOut(clamp01((t-start)/(end-start)));
  }

  // ── Current H₁ mean ──
  function getMu1(t){
    if(t<7.0) return MU1_INITIAL;
    if(t>9.2) return MU1_FINAL;
    return lerp(MU1_INITIAL, MU1_FINAL, ease(t,7.0,9.2));
  }

  // ── Resize ──
  function resize(){
    const vw=window.innerWidth, vh=window.innerHeight-56;
    const scale=Math.min(vw/STAGE_W, vh/STAGE_H);
    canvas.width=STAGE_W; canvas.height=STAGE_H;
    canvas.style.width=Math.round(STAGE_W*scale)+'px';
    canvas.style.height=Math.round(STAGE_H*scale)+'px';
    stageWrap.style.width=canvas.style.width;
    stageWrap.style.height=canvas.style.height;
    titleOverlay.style.transform=`translate(-50%,-50%) scale(${scale})`;
    watermark.style.transform=`scale(${scale})`;
    watermark.style.transformOrigin='bottom right';
  }
  resize(); window.addEventListener('resize',resize);

  // ── Plot layout ──
  function layout(){
    const m={left:280, right:280, top:200, bottom:280};
    const pw=STAGE_W-m.left-m.right;
    const ph=STAGE_H-m.top-m.bottom;
    const xMin=-3.5, xMax=7.0;
    const yMax=0.46;
    return {
      m, pw, ph, xMin, xMax, yMax,
      xToPx: x=>m.left+((x-xMin)/(xMax-xMin))*pw,
      yToPx: y=>m.top+ph-(y/yMax)*ph
    };
  }

  // ── Drawing helpers ──
  function fillUnderCurve(x0, x1, mu, sigma, color, alpha, L){
    if(alpha<=0) return;
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.fillStyle=color; ctx.beginPath();
    const N=260;
    for(let i=0;i<=N;i++){
      const x=x0+(x1-x0)*(i/N);
      const y=normalPDF(x,mu,sigma);
      if(i===0) ctx.moveTo(L.xToPx(x),L.yToPx(y));
      else ctx.lineTo(L.xToPx(x),L.yToPx(y));
    }
    ctx.lineTo(L.xToPx(x1),L.yToPx(0));
    ctx.lineTo(L.xToPx(x0),L.yToPx(0));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawCurve(mu, sigma, x0, x1, color, alpha, lw, L){
    if(alpha<=0) return;
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    const N=700;
    for(let i=0;i<=N;i++){
      const x=x0+(x1-x0)*(i/N);
      if(i===0) ctx.moveTo(L.xToPx(x),L.yToPx(normalPDF(x,mu,sigma)));
      else ctx.lineTo(L.xToPx(x),L.yToPx(normalPDF(x,mu,sigma)));
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawAxis(alpha, L){
    ctx.save(); ctx.globalAlpha=alpha;
    const {m, xMin, xMax, xToPx, yToPx}=L;

    // X-axis line
    ctx.strokeStyle='#556677'; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(xToPx(xMin),yToPx(0));
    ctx.lineTo(xToPx(xMax),yToPx(0));
    ctx.stroke();

    // X ticks & labels
    ctx.fillStyle='#8899aa'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.font='18px "Georgia","Times New Roman",serif';
    [-2,-1,0,1,2,3,4,5,6].forEach(xi=>{
      const px=xToPx(xi);
      ctx.beginPath(); ctx.moveTo(px,yToPx(0)); ctx.lineTo(px,yToPx(0)+7); ctx.stroke();
      ctx.fillText(String(xi),px,yToPx(0)+14);
    });

    ctx.font='16px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillStyle='#667788';
    ctx.fillText('标准化检验统计量',xToPx(1.5),yToPx(0)+50);

    // Y label
    ctx.save();
    ctx.translate(m.left-80,m.top+L.ph/2);
    ctx.rotate(-Math.PI/2);
    ctx.font='16px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillStyle='#667788'; ctx.textAlign='center';
    ctx.fillText('概率密度',0,0);
    ctx.restore();

    // Y tick marks (small)
    [0.1,0.2,0.3,0.4].forEach(y=>{
      const py=L.yToPx(y);
      ctx.beginPath();
      ctx.moveTo(xToPx(xMin),py);
      ctx.lineTo(xToPx(xMin)+6,py);
      ctx.stroke();
    });

    ctx.restore();
  }

  // ── Main draw ──
  function draw(t){
    const W=STAGE_W, H=STAGE_H;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#1a1d20'; ctx.fillRect(0,0,W,H);

    const mu1=getMu1(t);
    const L=layout();
    const {xToPx, yToPx, xMin, xMax, m}=L;

    // ═══════ Phase A: Axes (1.0-2.5s) ═══════
    drawAxis(ease(t,1.0,2.0), L);

    // ═══════ Phase B: H₀ curve (1.5-3.2s) ═══════
    if(t>=1.5){
      const hp=ease(t,1.5,2.5);
      drawCurve(MU0,1,xMin,xMax,'#d0d8e0',hp,2.8,L);

      // H₀ label
      if(t>=2.0){
        const lp=ease(t,2.0,2.6);
        ctx.save(); ctx.globalAlpha=lp;
        ctx.font='italic 21px "Georgia","Times New Roman",serif';
        ctx.fillStyle='#b8c0c8'; ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.fillText('H₀：零假设分布',xToPx(MU0),yToPx(normalPDF(MU0,MU0,1))-18);
        ctx.restore();
      }
    }

    // ═══════ Phase C: α rejection region (2.5-4.2s) ═══════
    if(t>=2.5){
      const ap=ease(t,2.5,3.6);

      // Fill α right tail
      fillUnderCurve(Z_CRIT, xMax, MU0, 1, 'rgba(224,123,90,0.25)', ap, L);

      // Dashed line at Z_CRIT
      const zCritH=normalPDF(Z_CRIT,MU0,1);
      ctx.save(); ctx.globalAlpha=ap;
      ctx.setLineDash([10,6]);
      ctx.strokeStyle='#e07b5a'; ctx.lineWidth=2.0;
      ctx.beginPath();
      ctx.moveTo(xToPx(Z_CRIT), yToPx(0)+6);
      ctx.lineTo(xToPx(Z_CRIT), yToPx(zCritH));
      ctx.stroke();
      ctx.setLineDash([]);

      // z_crit label
      ctx.font='bold 18px "Georgia","Times New Roman",serif';
      ctx.fillStyle='#e09b7a'; ctx.textAlign='left'; ctx.textBaseline='bottom';
      ctx.fillText('z = 1.645',xToPx(Z_CRIT)+14,yToPx(zCritH)-16);

      // α annotation
      ctx.font='bold 22px "Georgia","Times New Roman",serif';
      ctx.fillStyle='rgba(224,123,90,0.9)'; ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText('α = 0.05',xToPx(3.2),yToPx(0)+82);

      ctx.font='16px "Microsoft YaHei","PingFang SC",sans-serif';
      ctx.fillStyle='rgba(224,160,130,0.8)';
      ctx.fillText('第一类错误：H₀ 真时拒绝 H₀',xToPx(3.2),yToPx(0)+110);

      // Rejection region label
      ctx.font='15px "Microsoft YaHei","PingFang SC",sans-serif';
      ctx.fillStyle='rgba(224,160,130,0.6)';
      ctx.textAlign='center';
      ctx.fillText('拒绝域',xToPx(3.8),yToPx(0)+42);

      ctx.restore();
    }

    // ═══════ Phase D: H₁ curve (3.5-5.5s) ═══════
    if(t>=3.5){
      const hp=ease(t,3.5,4.8);
      drawCurve(MU1_INITIAL,1,xMin,xMax,'#8ab1c0',hp,2.8,L);

      // H₁ label (only during phase D before the shift)
      if(t<7.0 && t>=4.2){
        const lp=ease(t,4.2,4.8);
        ctx.save(); ctx.globalAlpha=lp;
        ctx.font='italic 21px "Georgia","Times New Roman",serif';
        ctx.fillStyle='#8ab1c0'; ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.fillText('H₁：备择分布  δ = 2.5',xToPx(MU1_INITIAL),yToPx(normalPDF(MU1_INITIAL,MU1_INITIAL,1))-18);
        ctx.restore();
      }

      // Arrow from μ₀ to μ₁
      if(t>=4.5 && t<7.0){
        const ap=ease(t,4.5,5.2);
        ctx.save(); ctx.globalAlpha=ap*0.5;
        ctx.setLineDash([6,4]);
        ctx.strokeStyle='rgba(138,177,192,0.5)'; ctx.lineWidth=1.8;
        ctx.beginPath();
        ctx.moveTo(xToPx(MU0+0.5),yToPx(0)+150);
        ctx.lineTo(xToPx(MU1_INITIAL-0.5),yToPx(0)+150);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle='rgba(138,177,192,0.6)'; ctx.textAlign='center';
        ctx.font='16px "Microsoft YaHei","PingFang SC",sans-serif';
        ctx.fillText('真实效应量 δ',xToPx((MU0+MU1_INITIAL)/2),yToPx(0)+142);
        ctx.restore();
      }
    }

    // ═══════ Phase E: β region (5.0-7.0s) ═══════
    if(t>=5.0 && t<7.5){
      // β = P(H₁ < z_crit) — area under H₁ from xMin to z_crit
      const bp=ease(t,5.0,6.2);
      fillUnderCurve(xMin, Z_CRIT, MU1_INITIAL, 1, 'rgba(138,177,192,0.25)', bp, L);

      if(t>=5.8){
        const lp=ease(t,5.8,6.2);
        ctx.save(); ctx.globalAlpha=lp;
        // β value
        ctx.font='bold 20px "Georgia","Times New Roman",serif';
        ctx.fillStyle='rgba(138,177,192,0.95)'; ctx.textAlign='right'; ctx.textBaseline='top';
        ctx.fillText('β ≈ 0.196',xToPx(Z_CRIT)-20,yToPx(0)+82);

        ctx.font='16px "Microsoft YaHei","PingFang SC",sans-serif';
        ctx.fillStyle='rgba(138,177,192,0.8)';
        ctx.fillText('第二类错误',xToPx(Z_CRIT)-20,yToPx(0)+110);
        ctx.fillText('H₁ 真时未能拒绝 H₀',xToPx(Z_CRIT)-20,yToPx(0)+132);

        ctx.restore();
      }
    }

    // ═══════ Phase F: Power (1−β) (6.2-8.0s) ═══════
    if(t>=6.2 && t<8.0){
      const pp=ease(t,6.2,7.2);
      // Power = area under H₁ from z_crit to xMax
      fillUnderCurve(Z_CRIT, xMax, MU1_INITIAL, 1, 'rgba(77,155,115,0.30)', pp, L);

      if(t>=6.8){
        const lp=ease(t,6.8,7.2);
        ctx.save(); ctx.globalAlpha=lp;
        ctx.font='bold 22px "Georgia","Times New Roman",serif';
        ctx.fillStyle='rgba(100,210,140,0.95)'; ctx.textAlign='left'; ctx.textBaseline='top';
        ctx.fillText('1−β ≈ 0.804',xToPx(3.6),yToPx(0)+82);

        ctx.font='16px "Microsoft YaHei","PingFang SC",sans-serif';
        ctx.fillStyle='rgba(120,200,150,0.8)';
        ctx.fillText('检验功效',xToPx(3.6),yToPx(0)+110);
        ctx.fillText('正确拒绝 H₀ 的概率',xToPx(3.6),yToPx(0)+132);
        ctx.restore();
      }
    }

    // ═══════ Phase G: H₁ shifts right (7.0-9.5s) ═══════
    if(t>=7.0){
      const sp=ease(t,7.0,9.2);

      // Ghost of original H₁ (fading out)
      if(sp<0.7){
        const ghostAlpha=(1-clamp01(sp/0.5))*0.25;
        drawCurve(MU1_INITIAL,1,xMin,xMax,'#8ab1c0',ghostAlpha,2.0,L);
        ctx.save(); ctx.globalAlpha=ghostAlpha;
        ctx.setLineDash([6,4]);
        ctx.strokeStyle='#8ab1c0'; ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(xToPx(MU1_INITIAL),yToPx(0)+170);
        ctx.lineTo(xToPx(MU1_INITIAL),yToPx(normalPDF(MU1_INITIAL,MU1_INITIAL,1)));
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.font='italic 15px "Georgia","Times New Roman",serif';
        ctx.fillStyle='rgba(138,177,192,0.5)'; ctx.textAlign='center';
        ctx.fillText('原始 δ = 2.5',xToPx(MU1_INITIAL),yToPx(0)+190);
        ctx.restore();
      }

      // Current (shifting) H₁
      drawCurve(mu1,1,xMin,xMax,'#9cc8d8',sp,3.2,L);

      // Current β (shrinking)
      const curBeta=normalCDF(Z_CRIT-mu1);
      fillUnderCurve(xMin, Z_CRIT, mu1, 1, 'rgba(138,177,192,0.30)', sp, L);

      // Current power (growing)
      fillUnderCurve(Z_CRIT, xMax, mu1, 1, 'rgba(77,155,115,0.35)', sp, L);

      // Top banner
      ctx.save(); ctx.globalAlpha=sp;
      const bx=xToPx(1.75), by=m.top-40;
      ctx.font='bold 23px "Microsoft YaHei","PingFang SC",sans-serif';
      ctx.fillStyle='#f0d8c0'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('增大样本量 → δ 增大 → β 缩小',bx,by);

      // Dynamic β and power
      const curPower=1-curBeta;
      ctx.font='bold 19px "Georgia","Times New Roman",serif';
      ctx.fillStyle='rgba(138,177,192,0.9)'; ctx.textAlign='right';
      ctx.fillText('β ≈ '+curBeta.toFixed(3),xToPx(Z_CRIT)-20,yToPx(0)+160);
      ctx.fillStyle='rgba(100,210,140,0.9)'; ctx.textAlign='left';
      ctx.fillText('1−β ≈ '+curPower.toFixed(3),xToPx(3.6),yToPx(0)+160);

      // Vertical marker at current H₁ center
      if(sp>0.3){
        ctx.setLineDash([4,6]);
        ctx.strokeStyle='rgba(156,200,216,0.4)'; ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(xToPx(mu1),yToPx(0)+170);
        ctx.lineTo(xToPx(mu1),yToPx(normalPDF(mu1,mu1,1)));
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.restore();
    }

    // ═══════ Phase H: Summary bar (9.0-10s) ═══════
    if(t>=9.0){
      const sp=ease(t,9.0,9.6);
      ctx.save(); ctx.globalAlpha=sp;

      const by=H-62, barW=740, barH=44;
      ctx.fillStyle='rgba(210,190,160,0.12)';
      ctx.beginPath();
      ctx.roundRect(W/2-barW/2, by-barH/2, barW, barH, 10);
      ctx.fill();

      ctx.font='bold 20px "Georgia","Times New Roman",serif';
      ctx.fillStyle='#e0d0c0'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('α 由研究者设定  ·  β 由 α、效应量、样本量共同决定',W/2,by-4);

      ctx.font='15px "Microsoft YaHei","PingFang SC",sans-serif';
      ctx.fillStyle='#998880';
      ctx.fillText('唯一同时降低两类错误的途径：增加样本量',W/2,by+24);
      ctx.restore();
    }
  }

  // ═══════════════════════════════════════════════════════
  // TITLE OVERLAY
  // ═══════════════════════════════════════════════════════
  function updateOverlay(t){
    if(t<0.8){
      const p=expoOut(clamp01(t/0.55));
      titleOverlay.style.opacity=lerp(0,1,p);
      titleOverlay.style.marginTop=lerp(36,0,p)+'px';
    }else if(t<1.3){
      titleOverlay.style.opacity=lerp(1,0,clamp01((t-0.8)/0.5));
    }else{titleOverlay.style.opacity='0'}
    watermark.style.opacity=t>8.8?clamp01((t-8.8)/0.7):'0';
  }

  function updateControls(t){
    timeDisplay.textContent=`${t.toFixed(1)}s / ${DURATION.toFixed(0)}s`;
    scrubFill.style.width=(t/DURATION*100).toFixed(2)+'%';
  }

  // ═══════════════════════════════════════════════════════
  // TICK
  // ═══════════════════════════════════════════════════════
  function tick(now){
    if(lastTick===null){
      lastTick=now; window.__ready=true;
      draw(time); updateOverlay(time); updateControls(time);
      requestAnimationFrame(tick); return;
    }
    const dt=(now-lastTick)/1000; lastTick=now;
    if(playing){
      let nt=time+dt;
      if(nt>=DURATION) nt=0;
      time=nt; draw(time); updateOverlay(time); updateControls(time);
    }
    requestAnimationFrame(tick);
  }

  // ═══════════════════════════════════════════════════════
  // CONTROLS
  // ═══════════════════════════════════════════════════════
  btnPlay.onclick=()=>{
    playing=!playing;
    btnPlay.textContent=playing?'⏸ 暂停':'▶ 播放';
    if(playing) lastTick=null;
  };
  btnReplay.onclick=()=>{
    time=0; playing=true; lastTick=null;
    btnPlay.textContent='⏸ 暂停';
    draw(0); updateOverlay(0); updateControls(0);
  };
  scrubber.onclick=e=>{
    const r=scrubber.getBoundingClientRect();
    time=clamp01((e.clientX-r.left)/r.width)*DURATION;
    playing=false; lastTick=null; btnPlay.textContent='▶ 播放';
    draw(time); updateOverlay(time); updateControls(time);
  };
  document.onkeydown=e=>{
    if(e.code==='Space'){e.preventDefault(); btnPlay.click();}
    else if(e.code==='KeyR') btnReplay.click();
    else if(e.code==='ArrowRight'){
      time=Math.min(DURATION,time+0.3); playing=false;
      draw(time); updateOverlay(time); updateControls(time);
    }
    else if(e.code==='ArrowLeft'){
      time=Math.max(0,time-0.3); playing=false;
      draw(time); updateOverlay(time); updateControls(time);
    }
  };

  draw(0); updateOverlay(0); updateControls(0);
  document.fonts.ready.then(()=>requestAnimationFrame(tick));
})();
</script>
</body>
</html>
