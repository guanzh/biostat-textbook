project:
  type: book
  output-dir: _site
  resources:
    - data/teaching/**

book:
  title: "从样地到结论：保护生物学数据实战"
  subtitle: "基于 R 语言的生物实验设计与统计分析"
  author: "管振华"
  date: "2026"
  language: zh

  # 第一至三篇为三个专业方向共用。第四篇及之后由各专业 profile 追加：
  #   quarto render --profile wildlife  → 野保版（_site-wildlife）
  #   quarto render --profile forest    → 森保版（_site-forest）
  #   quarto render --profile plant     → 植保版（_site-plant）
  chapters:
    - index.qmd

    - part: "第一篇：从保护问题进入统计"
      chapters:
        - chapters/01-role-of-statistics.qmd
        - chapters/02-variables-hypotheses.qmd
        - chapters/03-experimental-design.qmd

    - part: "第二篇：看懂并整理保护数据"
      chapters:
        - chapters/04-data-management.qmd
        - chapters/05-descriptive-statistics.qmd
        - chapters/06-sampling-error.qmd
        - chapters/07-data-visualization.qmd

    - part: "第三篇：回答常见保护问题"
      chapters:
        - chapters/08-two-group-comparison.qmd
        - chapters/09-anova.qmd
        - chapters/10-categorical-data.qmd
        - chapters/11-correlation-regression.qmd
        - chapters/12-glm-intro.qmd

  downloads: [epub]

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-tools: true
    code-link: true
    code-copy: true
    css: styles.css

# R 执行暂不启用。各章内容充实后，取消注释并本地渲染一次生成 _freeze 缓存
# execute:
#   engine: knitr
#   freeze: auto
