<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>占域与探测 · Occupancy and Detection</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0d1117;font-family:"Microsoft YaHei","PingFang SC",sans-serif}.stage{position:relative;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.5)}canvas{display:block}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.watermark{position:absolute;right:32px;bottom:24px;color:rgba(255,255,255,.18);font:11px Consolas,monospace;letter-spacing:.12em}.controls{position:fixed;inset:auto 0 0;padding:14px 24px;display:flex;align-items:center;gap:16px;background:rgba(13,17,23,.94);border-top:1px solid rgba(255,255,255,.08);color:#d0d8e0;font-size:13px}.controls button{padding:7px 16px;border:1px solid rgba(255,255,255,.15);border-radius:5px;background:rgba(255,255,255,.08);color:inherit;cursor:pointer}.time{min-width:90px;color:#8899aa;font-family:Consolas,monospace}.scrubber{position:relative;flex:1;height:5px;background:rgba(255,255,255,.12);border-radius:3px;cursor:pointer}.fill{height:100%;background:#e07b5a;border-radius:3px}</style></head>
<body><div class="stage" id="stage"><canvas id="mainCanvas" aria-label="占域与探测动画。动物始终占据样点，六次调查中只检出两次，全漏检概率随重复次数下降。"></canvas><p class="sr-only">动画区分潜在占域状态 z 和观测结果 y。探测概率 p 等于 0.5 时，连续 K 次全漏检概率为 (1 − p)ᴷ，六次约为 1.6%。重复调查提供观测过程信息。</p><div class="watermark">Created by Huashu-Design</div></div><div class="controls"><button id="btnPlay">⏸ 暂停</button><button id="btnReplay">⏮ 重播</button><div class="time" id="timeDisplay">0.0s / 10s</div><div class="scrubber" id="scrubber"><div class="fill" id="scrubFill"></div></div></div>
<script>(function(){
const canvas=document.getElementById('mainCanvas'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),btnPlay=document.getElementById('btnPlay'),btnReplay=document.getElementById('btnReplay'),timeDisplay=document.getElementById('timeDisplay'),scrubber=document.getElementById('scrubber'),scrubFill=document.getElementById('scrubFill');const STAGE_W=1920,STAGE_H=1080,DURATION=10,P_DETECT=.5,HISTORY=[0,1,0,0,1,0],missProb=Array.from({length:6},(_,i)=>Math.pow(1-P_DETECT,i+1));let time=0,playing=true,last=null;const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3),fade=(t,a,b)=>ease((t-a)/(b-a));
function resize(){const s=Math.min(innerWidth/STAGE_W,(innerHeight-56)/STAGE_H);canvas.width=STAGE_W;canvas.height=STAGE_H;canvas.style.width=Math.round(STAGE_W*s)+'px';canvas.style.height=Math.round(STAGE_H*s)+'px';stage.style.width=canvas.style.width;stage.style.height=canvas.style.height}addEventListener('resize',resize);resize();function text(s,x,y,size,color='#e0e4e8',align='center',weight=500){ctx.fillStyle=color;ctx.font=`${weight} ${size}px "Microsoft YaHei","PingFang SC",sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function camera(x,y,hit,p){ctx.save();ctx.globalAlpha=p;ctx.fillStyle='#31383e';ctx.strokeStyle=hit?'#e07b5a':'#68757f';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(x-55,y-42,110,84,9);ctx.fill();ctx.stroke();ctx.fillStyle=hit?'#e07b5a':'#1a1d20';ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill();text(hit?'1':'0',x,y+82,28,hit?'#e07b5a':'#7b8790','center',800);ctx.restore()}
function draw(t){ctx.fillStyle='#1a1d20';ctx.fillRect(0,0,STAGE_W,STAGE_H);if(t<1.1){const p=fade(t,0,.6)*(1-clamp((t-.85)/.25));ctx.globalAlpha=p;text('占域与探测',960,450,70,'#e7eaed','center',800);text('Occupancy state z · Detection process y',960,535,24,'#8899aa');ctx.globalAlpha=1;return}text('未检出，不等于不存在',960,105,30,'#c7d2d8','center',700);const animalP=fade(t,1,2.2);ctx.globalAlpha=animalP;ctx.fillStyle='rgba(49,94,70,.25)';ctx.beginPath();ctx.roundRect(260,230,1400,250,20);ctx.fill();text('潜在状态：z = 1，样点在整个调查期内被占据',960,285,28,'#9dc4a7','center',700);ctx.fillStyle='#77a98a';ctx.beginPath();ctx.ellipse(960,385,78,42,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(1015,352,30,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;if(t>=2.3){text('六次重复调查',960,540,24,'#aeb9c1','center',600);for(let i=0;i<6;i++){const start=2.3+i*.62,p=fade(t,start,start+.45);camera(430+i*212,650,HISTORY[i]===1,p)}}if(t>=6.2){const p=fade(t,6.2,7.4);ctx.globalAlpha=p;text('全部漏检的概率',470,825,23,'#aeb9c1','left',600);for(let i=0;i<6;i++){const x=560+i*175,h=missProb[i]*210;ctx.fillStyle=i===5?'#e07b5a':'#4d8294';ctx.fillRect(x,935-h,72,h);text(`${Math.round(missProb[i]*1000)/10}%`,x+36,955,17,'#cbd4d9');text(`K=${i+1}`,x+36,985,15,'#7f8c95')}text('(1 − p)ᴷ',1500,855,32,'#e9c2b1','center',800);text('K=6 时为 1.6%',1500,905,22,'#e07b5a','center',700);ctx.globalAlpha=1}if(t>=8.4){const p=fade(t,8.4,9.1);ctx.globalAlpha=p;ctx.fillStyle='rgba(49,94,70,.95)';ctx.beginPath();ctx.roundRect(350,855,1220,122,14);ctx.fill();text('重复调查提供观测过程信息，不保证每次都检出',960,900,29,'#edf4ef','center',800);text('至少一次检出可确认占据；全为 0 的样点仍有两种可能',960,947,21,'#b9d4c2');ctx.globalAlpha=1}}
function update(){timeDisplay.textContent=`${time.toFixed(1)}s / 10s`;scrubFill.style.width=time/DURATION*100+'%'}function tick(now){if(last===null){last=now;window.__ready=true}const dt=(now-last)/1000;last=now;if(playing){time+=dt;if(time>=DURATION)time=window.__recording?DURATION-.001:0}draw(time);update();requestAnimationFrame(tick)}btnPlay.onclick=()=>{playing=!playing;btnPlay.textContent=playing?'⏸ 暂停':'▶ 播放';last=null};btnReplay.onclick=()=>{time=0;playing=true;last=null;btnPlay.textContent='⏸ 暂停'};scrubber.onclick=e=>{const r=scrubber.getBoundingClientRect();time=clamp((e.clientX-r.left)/r.width)*DURATION;playing=false;btnPlay.textContent='▶ 播放';draw(time);update()};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();btnPlay.click()}else if(e.code==='KeyR')btnReplay.click();else if(e.code==='ArrowRight'){time=Math.min(DURATION,time+.5);playing=false}else if(e.code==='ArrowLeft'){time=Math.max(0,time-.5);playing=false}});draw(0);update();requestAnimationFrame(tick);
})();</script></body></html>
