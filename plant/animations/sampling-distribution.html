<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>抽样分布与标准误 · Sampling Distribution</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0d1117;font-family:"Microsoft YaHei","PingFang SC",sans-serif}.stage{position:relative;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.5)}canvas{display:block}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.watermark{position:absolute;right:32px;bottom:24px;color:rgba(255,255,255,.18);font:11px Consolas,monospace;letter-spacing:.12em}.controls{position:fixed;inset:auto 0 0;padding:14px 24px;display:flex;align-items:center;gap:16px;background:rgba(13,17,23,.94);border-top:1px solid rgba(255,255,255,.08);color:#d0d8e0;font-size:13px}.controls button{padding:7px 16px;border:1px solid rgba(255,255,255,.15);border-radius:5px;background:rgba(255,255,255,.08);color:inherit;cursor:pointer}.time{min-width:90px;color:#8899aa;font-family:Consolas,monospace}.scrubber{position:relative;flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12);cursor:pointer}.fill{height:100%;border-radius:3px;background:#e07b5a}
</style></head>
<body>
<div class="stage" id="stage"><canvas id="mainCanvas" aria-label="抽样分布动画。样本量从 4 增至 64 时，样本均值的分布收窄，原始个体差异保持不变。"></canvas><p class="sr-only">动画从同一总体反复抽样，比较 n 等于 4、16 和 64 时样本均值的抽样分布。标准误按 σ 除以 √n 缩小。</p><div class="watermark">Created by Huashu-Design</div></div>
<div class="controls"><button id="btnPlay">⏸ 暂停</button><button id="btnReplay">⏮ 重播</button><div class="time" id="timeDisplay">0.0s / 10s</div><div class="scrubber" id="scrubber"><div class="fill" id="scrubFill"></div></div></div>
<script>
(function(){
const canvas=document.getElementById('mainCanvas'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),btnPlay=document.getElementById('btnPlay'),btnReplay=document.getElementById('btnReplay'),timeDisplay=document.getElementById('timeDisplay'),scrubber=document.getElementById('scrubber'),scrubFill=document.getElementById('scrubFill');
const STAGE_W=1920,STAGE_H=1080,DURATION=10,CASES=[{n:4,se:.5,color:'#e07b5a'},{n:16,se:.25,color:'#4d8294'},{n:64,se:.125,color:'#77a98a'}];let time=0,playing=true,last=null;
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3),fade=(t,a,b)=>ease((t-a)/(b-a));
function mulberry32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function normalFrom(rng){const u=Math.max(rng(),1e-9),v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function sampleMeans(n,count,seed){const rng=mulberry32(seed);return Array.from({length:count},()=>{let sum=0;for(let i=0;i<n;i++)sum+=normalFrom(rng);return sum/n})}
CASES.forEach((c,i)=>c.means=sampleMeans(c.n,90,20260711+i));
function resize(){const s=Math.min(innerWidth/STAGE_W,(innerHeight-56)/STAGE_H);canvas.width=STAGE_W;canvas.height=STAGE_H;canvas.style.width=Math.round(STAGE_W*s)+'px';canvas.style.height=Math.round(STAGE_H*s)+'px';stage.style.width=canvas.style.width;stage.style.height=canvas.style.height}addEventListener('resize',resize);resize();
function text(s,x,y,size,color='#e0e4e8',align='center',weight=500){ctx.fillStyle=color;ctx.font=`${weight} ${size}px "Microsoft YaHei","PingFang SC",sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function bell(mu,sd,y0,h,color,alpha){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=5;ctx.beginPath();for(let i=0;i<=240;i++){const z=-3.5+7*i/240,x=mu+z*sd,y=y0-h*Math.exp(-.5*z*z);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();ctx.restore()}
function drawCase(c,row,p){const y=320+row*220,left=260,right=1660,w=right-left;ctx.globalAlpha=p;ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(left,y+95);ctx.lineTo(right,y+95);ctx.stroke();text(`n = ${c.n}`,left-70,y+5,31,c.color,'right',800);text(`SE = σ/√n = ${c.se}`,left-70,y+45,20,'#9ca8b2','right');const count=Math.floor(c.means.length*p);for(let i=0;i<count;i++){const x=left+w*(.5+c.means[i]/5),stack=i%12;ctx.fillStyle=c.color;ctx.globalAlpha=.55+.35*p;ctx.beginPath();ctx.arc(x,y+82-stack*6,5,0,Math.PI*2);ctx.fill()}bell((left+right)/2,w*c.se/5,y+92,100,c.color,p);ctx.globalAlpha=1}
function draw(t){ctx.fillStyle='#1a1d20';ctx.fillRect(0,0,STAGE_W,STAGE_H);if(t<1.1){const p=fade(t,0,.6)*(1-clamp((t-.85)/.25));ctx.globalAlpha=p;text('抽样分布',960,450,72,'#e7eaed','center',800);text('Sampling distribution · 标准误 = σ / √n',960,535,25,'#8899aa');ctx.globalAlpha=1;return}text('同一总体，反复抽样；每个样本只留下一个均值',960,105,27,'#c7d2d8','center',600);const p1=fade(t,1.0,2.8),p2=fade(t,3.0,4.9),p3=fade(t,5.2,7.2);drawCase(CASES[0],0,p1);drawCase(CASES[1],1,p2);drawCase(CASES[2],2,p3);if(t>=7.8){const p=fade(t,7.8,8.7);ctx.globalAlpha=p;ctx.fillStyle='rgba(49,94,70,.94)';ctx.beginPath();ctx.roundRect(390,885,1140,112,14);ctx.fill();text('样本量增大，均值分布收窄',960,920,31,'#edf4ef','center',800);text('个体差异 σ 没有变；改变的是均值估计的不确定性',960,963,22,'#b9d4c2');ctx.globalAlpha=1}}
function update(){timeDisplay.textContent=`${time.toFixed(1)}s / 10s`;scrubFill.style.width=time/DURATION*100+'%'}function tick(now){if(last===null){last=now;window.__ready=true}const dt=(now-last)/1000;last=now;if(playing){time+=dt;if(time>=DURATION)time=window.__recording?DURATION-.001:0}draw(time);update();requestAnimationFrame(tick)}btnPlay.onclick=()=>{playing=!playing;btnPlay.textContent=playing?'⏸ 暂停':'▶ 播放';last=null};btnReplay.onclick=()=>{time=0;playing=true;last=null;btnPlay.textContent='⏸ 暂停'};scrubber.onclick=e=>{const r=scrubber.getBoundingClientRect();time=clamp((e.clientX-r.left)/r.width)*DURATION;playing=false;btnPlay.textContent='▶ 播放';draw(time);update()};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();btnPlay.click()}else if(e.code==='KeyR')btnReplay.click();else if(e.code==='ArrowRight'){time=Math.min(DURATION,time+.5);playing=false}else if(e.code==='ArrowLeft'){time=Math.max(0,time-.5);playing=false}});draw(0);update();requestAnimationFrame(tick);
})();
</script></body></html>
