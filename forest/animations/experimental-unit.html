<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>实验单位与伪重复 · Experimental Unit</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0d1117;font-family:"Microsoft YaHei","PingFang SC",sans-serif}.stage{position:relative;overflow:hidden;border-radius:4px;box-shadow:0 0 80px rgba(0,0,0,.5)}canvas{display:block}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.watermark{position:absolute;right:32px;bottom:24px;color:rgba(255,255,255,.18);font:11px Consolas,monospace;letter-spacing:.12em}.controls{position:fixed;inset:auto 0 0;background:rgba(13,17,23,.94);border-top:1px solid rgba(255,255,255,.08);padding:14px 24px;display:flex;align-items:center;gap:16px;color:#d0d8e0;font-size:13px}.controls button{padding:7px 16px;border-radius:5px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:inherit;cursor:pointer}.time{min-width:90px;color:#8899aa;font-family:Consolas,monospace}.scrubber{position:relative;flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12);cursor:pointer}.fill{height:100%;border-radius:3px;background:#e07b5a}
</style>
</head>
<body>
<div class="stage" id="stage"><canvas id="mainCanvas" aria-label="实验单位动画。32 个小区各测量 5 株幼苗，共 160 条观测，但处理只在 32 个小区上独立分配。"></canvas><p class="sr-only">动画先展示 32 个独立小区，再展开每个小区内的 5 株幼苗。160 条观测不能当作 160 个独立处理重复。</p><div class="watermark">Created by Huashu-Design</div></div>
<div class="controls"><button id="btnPlay">⏸ 暂停</button><button id="btnReplay">⏮ 重播</button><div class="time" id="timeDisplay">0.0s / 10s</div><div class="scrubber" id="scrubber"><div class="fill" id="scrubFill"></div></div></div>
<script>
(function(){
const canvas=document.getElementById('mainCanvas'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
const btnPlay=document.getElementById('btnPlay'),btnReplay=document.getElementById('btnReplay'),timeDisplay=document.getElementById('timeDisplay'),scrubber=document.getElementById('scrubber'),scrubFill=document.getElementById('scrubFill');
const STAGE_W=1920,STAGE_H=1080,DURATION=10;let time=0,playing=true,last=null;
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3),fade=(t,a,b)=>ease((t-a)/(b-a));
function resize(){const s=Math.min(innerWidth/STAGE_W,(innerHeight-56)/STAGE_H);canvas.width=STAGE_W;canvas.height=STAGE_H;canvas.style.width=Math.round(STAGE_W*s)+'px';canvas.style.height=Math.round(STAGE_H*s)+'px';stage.style.width=canvas.style.width;stage.style.height=canvas.style.height}addEventListener('resize',resize);resize();
function text(s,x,y,size,color='#e0e4e8',align='center',weight=500){ctx.fillStyle=color;ctx.font=`${weight} ${size}px "Microsoft YaHei","PingFang SC",sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function draw(t){
 ctx.fillStyle='#1a1d20';ctx.fillRect(0,0,STAGE_W,STAGE_H);
 if(t<1.15){const p=fade(t,0,.6)*(1-clamp((t-.85)/.3));ctx.globalAlpha=p;text('实验单位',960,455,72,'#e7eaed','center',800);text('Experimental unit · n 从随机分配层级开始数',960,535,24,'#8899aa');ctx.globalAlpha=1;return}
 const gridP=fade(t,1,2.7),left=300,top=170,cw=300,ch=82,gx=28,gy=24;
 for(let i=0;i<32;i++){const r=Math.floor(i/4),c=i%4,x=left+c*(cw+gx),y=top+r*(ch+gy);ctx.globalAlpha=gridP;ctx.fillStyle='rgba(77,130,148,.12)';ctx.strokeStyle='#4d8294';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x,y,cw,ch,10);ctx.fill();ctx.stroke();text(`小区 ${i+1}`,x+18,y+22,16,'#9fb7c2','left',600);
   if(t>=3.1){const pp=fade(t,3.1,4.5);for(let j=0;j<5;j++){ctx.globalAlpha=pp;ctx.fillStyle='#e07b5a';ctx.beginPath();ctx.arc(x+64+j*46,y+55,8,0,Math.PI*2);ctx.fill()}}
 }
 ctx.globalAlpha=1;text('处理在小区层级独立随机分配',960,100,26,'#c7d2d8','center',600);
 if(t>=2.2){const p=fade(t,2.2,3.2);ctx.globalAlpha=p;text('n = 32 个实验单位',960,1010,34,'#77a98a','center',700);ctx.globalAlpha=1}
 if(t>=4.3){const p=fade(t,4.3,5.4);ctx.globalAlpha=p;text('每小区 5 株幼苗，共 160 条观测',960,950,28,'#e0b5a3','center',600);ctx.globalAlpha=1}
 if(t>=6.1){const p=fade(t,6.1,7.2);ctx.globalAlpha=p;ctx.fillStyle='rgba(200,102,82,.12)';ctx.fillRect(530,875,860,96);text('错误：把 160 株写成 n = 160',960,910,31,'#e07b5a','center',800);ctx.strokeStyle='#e07b5a';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(650,932);ctx.lineTo(1270,888);ctx.stroke();ctx.globalAlpha=1}
 if(t>=8.0){const p=fade(t,8,8.8);ctx.globalAlpha=p;ctx.fillStyle='rgba(49,94,70,.92)';ctx.beginPath();ctx.roundRect(360,855,1200,112,14);ctx.fill();text('观测更多，不等于独立重复更多',960,890,31,'#edf4ef','center',800);text('处理在哪一层独立分配，n 就从哪一层开始数',960,935,23,'#b9d4c2');ctx.globalAlpha=1}
}
function controls(){timeDisplay.textContent=`${time.toFixed(1)}s / 10s`;scrubFill.style.width=(time/DURATION*100)+'%'}
function tick(now){if(last===null){last=now;window.__ready=true}const dt=(now-last)/1000;last=now;if(playing){time+=dt;if(time>=DURATION)time=window.__recording?DURATION-.001:0}draw(time);controls();requestAnimationFrame(tick)}
btnPlay.onclick=()=>{playing=!playing;btnPlay.textContent=playing?'⏸ 暂停':'▶ 播放';last=null};btnReplay.onclick=()=>{time=0;playing=true;last=null;btnPlay.textContent='⏸ 暂停'};scrubber.onclick=e=>{const r=scrubber.getBoundingClientRect();time=clamp((e.clientX-r.left)/r.width)*DURATION;playing=false;btnPlay.textContent='▶ 播放';draw(time);controls()};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();btnPlay.click()}else if(e.code==='KeyR')btnReplay.click();else if(e.code==='ArrowRight'){time=Math.min(DURATION,time+.5);playing=false}else if(e.code==='ArrowLeft'){time=Math.max(0,time-.5);playing=false}});draw(0);controls();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
